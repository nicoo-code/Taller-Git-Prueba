<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking - Itinerario</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <aside class="panel left">
      <h2>Crear Itinerario</h2>
      <form id="itinerario-form">
        <label> Aeropuerto de salida
          <input type="text" name="salida" placeholder="Ej: El Dorado - BOG" required>
        </label>
        <label> Aeropuerto de llegada
          <input type="text" name="llegada" placeholder="Ej: José María Córdova - MDE" required>
        </label>
        <label> Intensidad horaria
          <select name="intensidad">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </label>
        <button type="submit">Agregar itinerario</button>
      </form>

      <h3>Itinerarios</h3>
      <ul id="itineraries"></ul>
    </aside>

    <main class="panel right">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="pluffy.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      if(window.pluffy && typeof window.pluffy.initMap === 'function') {
        window.pluffy.initMap('map');
      }

      const form = document.getElementById('itinerario-form');
      const list = document.getElementById('itineraries');

      form.addEventListener('submit', (e)=>{
        e.preventDefault();
        const salida = form.salida.value.trim();
        const llegada = form.llegada.value.trim();
        const intensidad = form.intensidad.value;

        const li = document.createElement('li');
        li.textContent = `${salida} → ${llegada} — Intensidad: ${intensidad}`;
        list.prepend(li);

        form.reset();
      });
    });
  </script>
</body>
</html>
