name: CI/CD Pipeline - Sistema Distribuido de Itinerarios

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'feature/**' ]

jobs:
  lint-and-style:
    name: 1. Linting and Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

  unit-tests:
    name: 2. Unit Tests & Coverage Report
    runs-on: ubuntu-latest
    needs: lint-and-style
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/airport-service/requirements.txt
          pip install -r services/itinerary-service/requirements.txt
          pip install -r services/notification-service/requirements.txt
          pip install -r services/api-gateway/requirements.txt
          pip install pytest pytest-cov pytest-mock httpx

      - name: Execute Tests with Coverage
        run: |
          pytest tests/unit -v --cov=services --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube-scan:
    name: 3. SonarQube Static Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  docker-build:
    name: 4. Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        service:
          - airport-service
          - itinerary-service
          - notification-service
          - api-gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest

  cd-preview:
    name: 5. Continuous Deployment Verification
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Orchestration
        run: |
          docker compose config
